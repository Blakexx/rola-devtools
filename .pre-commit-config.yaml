# rola-devtools' commit gate: ruff over the package and its tests, ruff's blank-line family (preview-gated, so its own
# invocation), the tests, and the mirror's declaration check run by the tool itself.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (rola_devtools, tests)
        language: system
        entry: ruff check
        files: ^(rola_devtools|tests)/.*\.py$
      - id: ruff-e3
        name: ruff E30x (blank-line spacing, preview)
        language: system
        entry: ruff check --preview --select E3
        files: ^(rola_devtools|tests)/.*\.py$
      - id: tests
        name: tests (python -m unittest)
        language: system
        entry: python3 -m unittest discover -s tests -t .
        pass_filenames: false
        always_run: true
      - id: mirror-declarations
        name: every tracked path is declared for the public mirror (.github/mirror/declarations.json)
        language: system
        entry: python3 -m rola_devtools.mirror --check
        pass_filenames: false
        always_run: true
